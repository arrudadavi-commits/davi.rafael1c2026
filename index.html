<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Santuário da Natureza</title>
  <style>
    /* Estilos Gerais para fixar o rodapé no fundo */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f9f4;
      color: #2b2b2b;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
    }

    /* BANNER DE DICAS NO TOPO */
    .banner-dicas {
      background-color: #0d3b2e;
      color: #ffffff;
      text-align: center;
      padding: 10px;
    }

    .btn-dica {
      background-color: #2e8b57;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .btn-dica:hover {
      background-color: #3cb371;
    }

    .painel-dicas {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease-out;
      background-color: #ffffff;
      color: #013220;
      text-align: left;
      max-width: 900px;
      margin: 0 auto;
      border-radius: 0 0 8px 8px;
    }

    .conteudo-dicas {
      padding: 15px 25px;
    }

    .conteudo-dicas ul {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }

    .conteudo-dicas li {
      margin-bottom: 12px;
      font-size: 1.05rem;
    }

    /* CABEÇALHO */
    header {
      background-color: #1b4d3e;
      color: #ffffff;
      text-align: center;
      padding: 3rem 1rem;
    }

    header h1 {
      margin: 0;
      font-size: 2.8rem;
    }

    header p {
      font-size: 1.2rem;
      margin-top: 8px;
      opacity: 0.9;
    }

    /* CONTEÚDO PRINCIPAL */
    main {
      flex: 1;
      max-width: 1000px;
      width: 100%;
      margin: 2rem auto;
      padding: 0 1rem;
      box-sizing: border-box;
    }

    .secao-titulo {
      color: #006400;
      text-align: center;
      margin-bottom: 1.5rem;
      font-size: 2rem;
    }

    /* GALERIA DE IMAGENS EM GRID */
    .galeria {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 2rem;
    }

    .card-imagem {
      background-color: #ffffff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card-imagem:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
    }

    .card-imagem img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }

    .card-conteudo {
      padding: 1.2rem;
    }

    .card-conteudo h3 {
      margin: 0 0 10px 0;
      color: #006400;
    }

    .card-conteudo p {
      margin: 0;
      font-size: 0.95rem;
      color: #444;
    }

    /* CARD DE DESTAQUE */
    .card-destaque {
      background-color: #ffffff;
      border-radius: 10px;
      padding: 2rem;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1
